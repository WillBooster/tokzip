name: Rust
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'dict/**'
      - 'priors/**'
      - 'wasm/**'
      - 'mise.toml'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'dict/**'
      - 'priors/**'
      - 'wasm/**'
      - 'mise.toml'
      - '.github/workflows/rust.yml'
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7.0.1
      # mise installs the toolchain mise.toml pins: the committed wasm is byte-compared
      # below and rustc embeds version-specific bytes, so a floating toolchain would fail
      # the comparison at every Rust release.
      - uses: jdx/mise-action@v5.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --release --all-features
      - name: Verify the committed wasm module matches the sources
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p tokzip-wasm
          cmp target/wasm32-unknown-unknown/release/tokzip_wasm.wasm ../wasm/tokzip.wasm
      - name: Upload the rebuilt module when verification fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rebuilt-wasm
          path: rust/target/wasm32-unknown-unknown/release/tokzip_wasm.wasm
          retention-days: 1
          if-no-files-found: ignore
      - name: Build alternative profiles for reproducibility diagnosis
        if: failure()
        run: |
          mkdir -p ../.tmp/profile-wasm
          for opt in 2 3; do
            for lto in fat thin false; do
              CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" CARGO_PROFILE_RELEASE_LTO="$lto" CARGO_TARGET_DIR=../.tmp/profile-target cargo build --locked --release --target wasm32-unknown-unknown -p tokzip-wasm
              cp ../.tmp/profile-target/wasm32-unknown-unknown/release/tokzip_wasm.wasm "../.tmp/profile-wasm/opt-$opt-lto-$lto.wasm"
            done
          done
      - name: Upload alternative profile modules
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: profile-wasm
          path: .tmp/profile-wasm/*.wasm
          retention-days: 1
          if-no-files-found: ignore
