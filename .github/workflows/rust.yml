name: Rust
on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: Verify the committed wasm module matches the sources
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p tokzip-wasm
          cmp target/wasm32-unknown-unknown/release/tokzip_wasm.wasm ../wasm/tokzip.wasm
