[package]
name = "tokzip"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
crc32fast = { version = "1", default-features = false }

[features]
train = []

[[bin]]
name = "train-priors"
required-features = ["train"]

# The corpus harnesses read a tokzip-corpus checkout through the `train` module's manifest reader.
[[example]]
name = "corpus"
required-features = ["train"]

[[example]]
name = "mixed"
required-features = ["train"]
