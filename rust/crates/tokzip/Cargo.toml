[package]
name = "tokzip"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
crc32fast = { version = "=1.5.0", default-features = false }
serde_json = { version = "=1.0.151", optional = true }

[features]
train = ["dep:serde_json"]

[[bin]]
name = "train"
required-features = ["train"]

# The corpus harnesses read a tokzip-corpus checkout through the `train` module's manifest reader.
[[example]]
name = "mixed"
required-features = ["train"]

[[example]]
name = "eval"
required-features = ["train"]

[[example]]
name = "prof"
required-features = ["train"]
