# The wasm module is optimized for size (opt-level "s" measured 25 KB smaller at the same
# speed); native builds — the trainer and the corpus harnesses — keep the speed-optimized
# release profile. Cargo reads this file when run from `rust/` (as the build script and CI do).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=s"]
