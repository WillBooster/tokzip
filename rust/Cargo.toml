[workspace]
resolver = "2"
members = ["crates/tokzip", "crates/tokzip-wasm"]

# No license declaration: the repository is private/UNLICENSED (see package.json);
# both crates set `publish = false`, which lifts Cargo's license-field requirement.
[workspace.package]
edition = "2021"

# The wasm module is built with this profile. `opt-level = "s"` measured 24 KB smaller at the
# same speed but its function order differed between macOS and Linux hosts, so the committed
# module could not be reproduced by CI; `opt-level = 3` builds byte-identically on both.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

