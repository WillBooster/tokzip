[workspace]
resolver = "2"
members = ["crates/tokzip", "crates/tokzip-wasm"]

# No license declaration: the repository is private/UNLICENSED (see package.json);
# both crates set `publish = false`, which lifts Cargo's license-field requirement.
[workspace.package]
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The wasm module is built with this profile: optimized for size (25 KB smaller than
# `opt-level = 3` at the same measured speed). Native builds — the trainer and the corpus
# harnesses — use the speed-optimized release profile.
[profile.wasm]
inherits = "release"
opt-level = "s"
